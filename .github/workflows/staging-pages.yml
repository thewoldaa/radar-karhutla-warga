# Publishes a static STAGING build to GitHub Pages (github.io).
#
# What this is: a public demo of the UI on baked-in DEMO data, clearly labelled
# "STAGING — DATA CONTOH". It is NOT the production site.
#
# Why not production: GitHub's Pages terms state the service is "not intended for
# or allowed to be used as a free web-hosting service to run your online business
# ... or any other website that is primarily directed at either facilitating
# commercial transactions". Donation buttons and crowdfunding links are explicitly
# permitted; advertising is not addressed. To keep production clear of that grey
# area, production runs on Cloudflare Pages (advertising allowed, unlimited static
# bandwidth) — see docs/04-HOSTING.md.
#
# Prerequisite: repository Settings → Pages → Source = "GitHub Actions".

name: Staging (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Remove server-only routes (static export has no server)
        run: |
          # Route handlers cannot exist under `output: export`. The staging site
          # runs on demo data, so the API surface is removed for this build only.
          rm -rf src/app/api

      - name: Static export (demo data only)
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_DEMO_MODE: "false" # demo comes from STATIC_MODE, not this flag
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
